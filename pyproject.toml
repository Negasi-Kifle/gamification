# Gamification Service - Project Configuration
# PR and code review tooling

[project]
name = "gamification"
version = "0.1.0"
description = "Gamification & CRM service for the Convex platform"
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
# Target Python 3.12
target-version = "py312"

# Line length (same as black default)
line-length = 88

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    "migrations",
    "*_pb2.py",
    "*_pb2_grpc.py",
]

[tool.ruff.lint]
# Enable rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented out code)
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
]

# Ignore rules
ignore = [
    "E501",   # Line too long (handled by formatter)
    "PLR0913", # Too many arguments to function call
    "PLR2004", # Magic value used in comparison
    "ARG001",  # Unused function argument (common in Django/gRPC)
    "ARG002",  # Unused method argument
    "ERA001",  # Commented-out code (intentional examples in TODOs)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
# isort configuration
known-first-party = ["bonus", "shared", "gamification"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
# Tests can have magic values and unused arguments
"tests/**/*.py" = ["PLR2004", "ARG001", "ARG002"]
"**/tests/*.py" = ["PLR2004", "ARG001", "ARG002"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Respect magic trailing commas
skip-magic-trailing-comma = false

# Format docstrings
docstring-code-format = true

[tool.bandit]
# Security linting configuration
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]  # Skip assert_used (common in tests)

[tool.pytest.ini_options]
# Pytest configuration
DJANGO_SETTINGS_MODULE = "gamification.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
# Coverage configuration
source = ["bonus", "shared"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*_pb2.py",
    "*_pb2_grpc.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

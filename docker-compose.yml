# Docker Compose for Gamification Service
# Local development environment with all dependencies

services:
  # Main application service (HTTP/REST)
  gamification-restful:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamification-restful
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,gamification-restful
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-gamification}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=postgres
      - DB_PORT=5432
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/bonus/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - gamification-network
    volumes:
      - .:/app:ro  # Read-only mount for development hot-reload (remove in production)
    restart: unless-stopped


  # gRPC server service
  gamification-grpc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamification-grpc
    command: ["python", "-m", "shared.grpc.server"]
    ports:
      - "50051:50051"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-gamification}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=postgres
      - DB_PORT=5432
      - GRPC_PORT=50051
      - GRPC_MAX_WORKERS=10
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gamification-network
    volumes:
      - .:/app:ro  # Read-only mount for development hot-reload (remove in production)
    restart: unless-stopped


  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: gamification-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-gamification}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${DB_NAME:-gamification}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gamification-network
    restart: unless-stopped


  # Kafka (for event streaming)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: gamification-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - gamification-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: gamification-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - gamification-network
    restart: unless-stopped

  # Schema Registry (for Avro schemas)
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: gamification-schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - gamification-network
    restart: unless-stopped

  # Jaeger (for distributed tracing)
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: gamification-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Accept traces directly
      - "6831:6831/udp"  # Accept traces via UDP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - gamification-network
    restart: unless-stopped

networks:
  gamification-network:
    driver: bridge

volumes:
  postgres-data:

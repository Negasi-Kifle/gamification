# GitLab CI/CD Configuration for Gamification Service
# Per technical guideline §7 and §10

stages:
  - lint
  - test
  - build
  - deploy

variables:
  PYTHON_VERSION: "3.12"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POSTGRES_DB: gamification_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

# Cache pip packages between jobs
cache:
  key: "${CI_JOB_NAME}"
  paths:
    - .cache/pip
    - .venv/

# Base Python image
.python-base:
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt

# =============================================================================
# Lint Stage
# =============================================================================

lint:ruff:
  extends: .python-base
  stage: lint
  script:
    - echo "Running ruff linter..."
    - ruff check .
    - echo "Checking ruff formatting..."
    - ruff format --check .
  allow_failure: false

lint:bandit:
  extends: .python-base
  stage: lint
  script:
    - echo "Running security linter..."
    - bandit -c pyproject.toml -r bonus/ shared/ gamification/
  allow_failure: false

lint:migrations:
  extends: .python-base
  stage: lint
  services:
    - postgres:16-alpine
  variables:
    DB_HOST: postgres
    DB_NAME: $POSTGRES_DB
    POSTGRES_USER: $POSTGRES_USER
    DB_PASSWORD: $POSTGRES_PASSWORD
    DJANGO_SETTINGS_MODULE: gamification.settings
  script:
    - echo "Checking for uncommitted migrations..."
    - python manage.py makemigrations --check --dry-run
    - echo "Linting migrations for risky operations..."
    - python manage.py lintmigrations --no-cache
  allow_failure: false

# =============================================================================
# Test Stage
# =============================================================================

test:unit:
  extends: .python-base
  stage: test
  services:
    - postgres:16-alpine
  variables:
    DB_HOST: postgres
    DB_NAME: $POSTGRES_DB
    POSTGRES_USER: $POSTGRES_USER
    DB_PASSWORD: $POSTGRES_PASSWORD
    DJANGO_SETTINGS_MODULE: gamification.settings
  script:
    - echo "Running unit tests..."
    - pytest --junitxml=report.xml --cov=bonus --cov=shared --cov-report=xml
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)/'

test:integration:
  extends: .python-base
  stage: test
  services:
    - postgres:16-alpine
    - redis:7-alpine
  variables:
    DB_HOST: postgres
    DB_NAME: $POSTGRES_DB
    POSTGRES_USER: $POSTGRES_USER
    DB_PASSWORD: $POSTGRES_PASSWORD
    REDIS_URL: redis://redis:6379/0
    DJANGO_SETTINGS_MODULE: gamification.settings
  script:
    - echo "Running migrations..."
    - python manage.py migrate --no-input
    - echo "Running integration tests..."
    - pytest --junitxml=report-integration.xml -m integration
  artifacts:
    when: always
    reports:
      junit: report-integration.xml
  allow_failure: true  # Integration tests may be skipped initially

# =============================================================================
# Build Stage
# =============================================================================

build:docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building Docker image..."
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    - echo "Pushing Docker image..."
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main
    - tags

build:docker-tag:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building tagged Docker image..."
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  only:
    - tags

# =============================================================================
# Deploy Stage (Examples)
# =============================================================================

deploy:staging:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "Deploying to staging..."
    # - kubectl apply -k deployment/k8s/staging/
  environment:
    name: staging
    url: https://staging.gamification.example.com
  only:
    - main
  when: manual

deploy:production:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "Deploying to production..."
    # - kubectl apply -k deployment/k8s/production/
  environment:
    name: production
    url: https://gamification.example.com
  only:
    - tags
  when: manual

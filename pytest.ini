[pytest]
# Django settings
DJANGO_SETTINGS_MODULE = gamification.settings

# Python paths
pythonpath = .

# Test discovery
testpaths = bonus/tests

# Output and Django options
# --reuse-db: Reuse test database between runs for faster tests
# --create-db: Force recreation of test database (use when schema changes)
addopts = -v --tb=short --reuse-db

# Markers
markers =
    django_db: mark test as requiring database access
